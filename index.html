<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizz Bottle Landing Page</title>
    <link rel="stylesheet" href="in.css">
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="eyebrow">limited craft soda</p>

                </p>
                <div class="hero-actions">
                    <a class="btn primary" href="#">Order now</a>

            </div>

            <div class="banner">
                <div class="product">
                    <div class="soda" style="--url: url(coca.jpg)"></div>
                    <div class="soda" style="--url: url(canva.png)"></div>
                </div>
            </div>
        </section>
